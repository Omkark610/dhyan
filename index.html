<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Player</title>
<style>
  :root { --bg:#14171c; --panel:#1d222a; --text:#e8ecf1; --accent:#3d8bfd; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:20px; padding:24px; color:var(--text);
         background: radial-gradient(ellipse at 50% 120%, #1b2540 0%, #0d1018 55%, #07090e 100%) fixed;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* Starfield sits behind everything */
  #stars { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .player, .controls { position:relative; z-index:1; }

  .player { width:min(960px,100%); aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
  .player iframe { width:100%; height:100%; border:0; display:block; }
  .controls { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; padding:10px 14px;
              border-radius:999px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
              backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
              box-shadow:0 8px 30px rgba(0,0,0,.4); }
  button { display:inline-flex; align-items:center; gap:10px; padding:12px 22px; font-size:15px; font-weight:600;
           letter-spacing:.3px; color:var(--text); background:rgba(255,255,255,.07);
           border:1px solid rgba(255,255,255,.14); border-radius:999px; cursor:pointer;
           transition:transform .15s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease; }
  button svg { width:20px; height:20px; fill:currentColor; flex:none; transition:transform .2s ease; }
  button:hover { transform:translateY(-2px); border-color:var(--accent); background:rgba(61,139,253,.18);
                 box-shadow:0 0 18px rgba(61,139,253,.55); }
  button:hover svg { transform:scale(1.15); }
  button:active { transform:translateY(0) scale(.96); }
  button.primary { background:linear-gradient(135deg,#3d8bfd,#7a5cff); border-color:transparent; color:#fff;
                   box-shadow:0 0 20px rgba(91,110,255,.55); }
  button.primary:hover { box-shadow:0 0 28px rgba(122,92,255,.8); background:linear-gradient(135deg,#5599ff,#8d72ff); }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
  @media (max-width:480px) { button { padding:12px 16px; } button span { display:none; } }
</style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <div class="player"><div id="yt"></div></div>

  <div class="controls">
    <button class="primary" id="play" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
      <span>Play</span>
    </button>
    <button id="pause" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4.5" height="15" rx="1.2"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1.2"/></svg>
      <span>Pause</span>
    </button>
    <button id="full" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4v2H6v3H4zm14-5h1a1 1 0 0 1 1 1v4h-2V6h-3V4h3zM4 15h2v3h3v2H5a1 1 0 0 1-1-1v-4zm14 0h2v4a1 1 0 0 1-1 1h-4v-2h3v-3z"/></svg>
      <span>Fullscreen</span>
    </button>
  </div>

  <script>
    // Slow-moving starfield
    (function () {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w, h, dpr, stars = [];

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.round((w * h) / 4500); // density scales with screen size
        stars = Array.from({ length: count }, () => {
          const depth = Math.random();              // 0 = far, 1 = near
          return {
            x: Math.random() * w,
            y: Math.random() * h,
            r: 0.4 + depth * 1.3,                   // nearer stars are bigger
            speed: 2 + depth * 8,                   // px per second, nearer move faster
            tw: Math.random() * Math.PI * 2,        // twinkle phase
            tws: 0.4 + Math.random() * 0.9          // twinkle speed
          };
        });
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.1);
        last = now;
        ctx.clearRect(0, 0, w, h);

        for (const s of stars) {
          if (!reduceMotion) {
            s.x += s.speed * dt;                    // drift slowly to the right
            s.y += s.speed * 0.25 * dt;             // and a touch downward
            s.tw += s.tws * dt;
            if (s.x > w + 2) { s.x = -2; s.y = Math.random() * h; }
            if (s.y > h + 2) { s.y = -2; s.x = Math.random() * w; }
          }
          const alpha = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(s.tw));
          ctx.globalAlpha = alpha;
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(frame);
    })();
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt', {
        videoId: 'fFZxYjtfnEc',
        width: '100%', height: '100%',
        playerVars: { start: 6056, rel: 0, playsinline: 1 }
      });
    }
    document.getElementById('play').onclick  = () => player && player.playVideo();
    document.getElementById('pause').onclick = () => player && player.pauseVideo();
    document.getElementById('full').onclick  = () => {
      const f = player && player.getIframe();
      if (!f) return;
      (f.requestFullscreen || f.webkitRequestFullscreen || f.msRequestFullscreen).call(f);
    };
  </script>
</body>
</html>
